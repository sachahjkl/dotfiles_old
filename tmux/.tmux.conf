# Enable mouse mode (tmux 2.1 and above)
set -g mouse on

# Set prefix
unbind C-b
set -g prefix ²
bind-key ² send-prefix

# Start window numbering at 1
set -g base-index 1

######################
### DESIGN CHANGES ###
######################

# loud or quiet?
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

#  modes
setw -g clock-mode-colour colour231
setw -g mode-style 'fg=colour231 bg=colour27 bold'

# panes
set -g pane-border-style 'fg=colour231 bg=colour0'
set -g pane-active-border-style 'bg=colour0 fg=colour27'

# statusbar
set -g status-position bottom
set -g status-justify left
set -g status-style 'bg=colour19 fg=colour137 dim'
set -g status-left ''
set -g status-right '#[fg=colour231,bg=colour27] %d/%m #[fg=colour231,bg=colour9] %H:%M:%S '
set -g status-right-length 50
set -g status-left-length 20

setw -g window-status-current-style 'fg=colour1 bg=colour27 bold'
setw -g window-status-current-format ' #I#[fg=colour249]:#[fg=colour231]#W#[fg=colour249]#F '

setw -g window-status-style 'fg=colour9 bg=colour19'
setw -g window-status-format ' #I#[fg=colour237]:#[fg=colour250]#W#[fg=colour244]#F '

setw -g window-status-bell-style 'fg=colour231 bg=colour1 bold'

# messages
set -g message-style 'fg=colour231 bg=colour27 bold'



# repair home/end
#bind-key -n End send-key C-e
#bind-key -n Home send-key C-a
set -g default-terminal "screen-256color"
